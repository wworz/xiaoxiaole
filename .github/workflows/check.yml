name: 开心消消乐兑换码监控

on:
  schedule:
    # 每 30 分钟执行一次（UTC 时间）
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write  # 需要写权限来提交 seen_codes.json

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来提交

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行兑换码监控
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python main.py

      - name: 提交 seen_codes.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查 seen_codes.json 是否有变化
          git add seen_codes.json
          if git diff --cached --quiet; then
            echo "没有新的兑换码，无需提交"
          else
            git commit -m "chore: 更新兑换码记录 [skip ci]"
            git push
            echo "已提交更新的兑换码记录"
          fi
