name: 开心消消乐兑换码监控

on:
  schedule:
    # 常规检查：每 30 分钟一次（取每小时第 5/35 分钟，错开日报任务，避免同时运行产生提交冲突）
    - cron: '5,35 * * * *'
    # 每日报告：北京时间 23:30（UTC 15:30），当天没有推送时发一条"无新码"日报
    - cron: '30 15 * * *'
  workflow_dispatch:
    # 支持手动触发
    inputs:
      mode:
        description: '运行模式（monitor=正常监控，report=每日报告）'
        required: false
        default: 'monitor'
        type: choice
        options:
          - monitor
          - report

permissions:
  contents: write  # 需要写权限来提交状态文件

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来提交

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行兑换码监控或每日报告
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          # 由日报 cron 触发时运行每日报告；其余情况（常规定时/手动触发）运行正常监控
          # 手动触发时也可通过 mode 参数选择 report 模式
          if [[ "${{ github.event.schedule }}" == "30 15 * * *" || "${{ github.event.inputs.mode }}" == "report" ]]; then
            echo "运行每日报告..."
            python main.py --daily-report
          else
            echo "运行兑换码监控..."
            python main.py
          fi

      - name: 提交状态文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 提交监控状态文件（seen_codes 兑换码记录 / push_log 推送日志 / pending_push 待发队列）
          for f in seen_codes.json push_log.json pending_push.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "状态文件无变化，无需提交"
          else
            git commit -m "chore: 更新监控状态文件 [skip ci]"
            git push
            echo "已提交更新的监控状态文件"
          fi
